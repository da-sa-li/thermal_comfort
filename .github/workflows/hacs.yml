name: Validate with HACS

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hacs:
    name: HACS Action
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v5"
      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"
          # This repository is a fork and is not published to HACS itself, so the
          # checks that validate repository properties rather than the integration
          # do not apply: forks inherit no topics, have issues disabled, and get
          # their license detected from the upstream default branch.
          ignore: "topics issues license"
